# iReader CI/CD Pipeline
# ======================
# push 到 main 分支时自动执行：类型检查 → 构建 → 测试 → 构建产物归档（artifact）
#
# Phase 0 / D26 修复记录：
#   1. npm ci → pnpm --frozen-lockfile（仓库根与 backend/ 无 package-lock.json，npm ci 必挂、
#      cache:'npm' 先报错；仓库真实 lockfile 为 pnpm-lock.yaml）
#   2. 移除 runner 自部署 + localhost 健康检查步骤（GitHub runner 上部署本机无意义），
#      改为上传构建产物 artifact，部署仍由本地 deploy.sh 执行
#   3. backend 安装后显式 rebuild better-sqlite3，防止 Node ABI 漂移导致测试静默全挂
#      （参见 docs/comprehensive-audit-and-upgrade-plan.md §1.2）
#
# 如需本地一键执行完整部署，运行：bash deploy.sh

name: iReader CI/CD

on:
  push:
    branches: [main]
  # 允许手动触发
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: 安装根依赖
        run: pnpm install --frozen-lockfile

      - name: 安装 backend 依赖
        working-directory: ./backend
        run: pnpm install --frozen-lockfile

      - name: 重建 better-sqlite3 原生模块（防 Node ABI 漂移）
        working-directory: ./backend
        run: pnpm rebuild better-sqlite3

      - name: 安装 frontend 依赖
        working-directory: ./frontend
        run: pnpm install --frozen-lockfile

      - name: ① 类型检查
        run: pnpm run typecheck

      - name: ② 构建项目
        run: pnpm run build

      - name: ③ 运行测试
        run: pnpm test

      - name: ④ 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ireader-dist
          path: |
            backend/dist
            frontend/dist
          retention-days: 7
